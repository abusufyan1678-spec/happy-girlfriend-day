<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Girlfriend Day ❤️</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden;
font-family:Arial;background:linear-gradient(180deg,#12001f,#2b003b,#000);color:#fff}
.card{background:rgba(255,255,255,.08);padding:28px;border-radius:22px;backdrop-filter:blur(10px);
box-shadow:0 0 25px #ff4d88;text-align:center;max-width:420px}
h1{color:#ff77b4}button{padding:12px 24px;border:0;border-radius:30px;background:#ff4d88;color:#fff;font-size:18px;cursor:pointer}
#msg{display:none;white-space:pre-wrap;line-height:1.6;margin-top:18px}
.heart{position:fixed;bottom:-20px;animation:up linear infinite}
@keyframes up{to{transform:translateY(-120vh);opacity:0}}
</style></head><body>
<div class="card">
<h1>💖 Happy Girlfriend Day 💖</h1>
<h2>To My Dearest Zafi ❤️</h2>
<p>You make every day special.</p>
<button onclick="openGift()">🎁 Open Your Surprise</button>
<div id="msg"></div>
</div>
<script>
for(let i=0;i<90;i++){let h=document.createElement('div');h.className='heart';h.textContent=['❤️','💕','💖','🌹'][i%4];
h.style.left=Math.random()*100+'vw';h.style.fontSize=(16+Math.random()*18)+'px';h.style.animationDuration=(4+Math.random()*5)+'s';document.body.appendChild(h);}
const text=`My Dearest Zafi ❤️

Happy Girlfriend Day!

You are the best part of my life.
Every smile of yours makes my world brighter.

I Love You Forever. 💖

Forever Yours,
Sufi ❤️`;
function openGift(){msg.style.display='block';let i=0;msg.textContent='';let t=setInterval(()=>{msg.textContent+=text[i++]||'';if(i>text.length)clearInterval(t);},35);}
</script></body></html>
